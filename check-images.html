<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EXIE Image Check</title><style>body{font:16px system-ui,sans-serif;margin:24px;background:#f4f7fb;color:#102b49}h1{font-size:1.6rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.item{background:white;border:1px solid #dce5ef;border-radius:12px;padding:12px;overflow-wrap:anywhere}.item img{width:100%;height:150px;object-fit:contain;background:#eef2f7}.status{font-weight:700}.ok{color:#087c4b}.bad{color:#c22}</style></head><body><h1>EXIE Image Check</h1><p>This page checks whether the image files at the repository root are loading on GitHub Pages.</p><div class="grid" id="grid"></div><script>const files=['exie-logo.png','exie-symbol-logo.jpg','exie-hero-american-flag.png','pricing-single-applicant.jpg','pricing-married-couple.jpg','pricing-child-dependent.jpg','pricing-email-creation.jpg','exie-waiting-area.jpg','exie-data-entry-workspace.jpg','exie-office-entrance.jpg','exie-baby-photo-room.jpg','exie-camera-equipment-illustration.jpg','exie-studio-lighting-illustration.jpg','exie-testimonials-1.png','exie-testimonials-2.png','exie-backup-generator.png'];const grid=document.getElementById('grid');files.forEach(file=>{const card=document.createElement('div');card.className='item';const img=document.createElement('img');img.src='./'+file;img.alt=file;const label=document.createElement('p');label.textContent=file;const status=document.createElement('p');status.className='status';status.textContent='Checking…';img.onload=()=>{status.textContent='Loaded successfully';status.classList.add('ok')};img.onerror=()=>{status.textContent='FAILED — file missing or path incorrect';status.classList.add('bad')};card.append(img,label,status);grid.append(card)});</script></body></html>
