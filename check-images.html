<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EXIE Image Check</title><style>body{font:16px system-ui;margin:24px;color:#123}h1{color:#07539b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.item{border:1px solid #d7e4f2;border-radius:12px;padding:12px;overflow-wrap:anywhere}.item img{display:block;width:100%;height:150px;object-fit:contain;background:#f2f6fa;border-radius:8px}.status{font-weight:700}.ok{color:#16723a}.bad{color:#b42318}</style></head><body><h1>EXIE image check</h1><p>This page checks that image files in the extracted website package are reachable. If an image says FAILED, check its file path and letter case.</p><div id="grid" class="grid"></div><script>const files=['./exie-logo.png','./exie-hero-american-flag.png','./exie-waiting-area.jpg','./exie-data-entry-workspace.jpg','./exie-office-entrance.jpg','./exie-baby-photo-room.jpg','./exie-camera-equipment-illustration.jpg','./exie-studio-lighting-illustration.jpg','./exie-testimonials-1.png','./exie-testimonials-2.png','./exie-backup-generator.png','./pricing-single-applicant.jpg','./pricing-married-couple.jpg','./pricing-child-dependent.jpg','./pricing-email-creation.svg'];const grid=document.getElementById('grid');files.forEach(src=>{const card=document.createElement('div');card.className='item';const img=document.createElement('img');img.src=src.startsWith('./')?src:'./'+src;img.alt=src;const label=document.createElement('div');label.textContent=src;const status=document.createElement('p');status.className='status';status.textContent='Checking…';img.onload=()=>{status.textContent='OK — image loaded';status.className='status ok'};img.onerror=()=>{status.textContent='FAILED — file not found';status.className='status bad'};card.append(img,label,status);grid.append(card)});</script></body></html>
